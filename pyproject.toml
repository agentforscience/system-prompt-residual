[project]
name = "research-workspace"
version = "0.1.0"
description = "Research workspace for experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.3.5",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "vllm>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
